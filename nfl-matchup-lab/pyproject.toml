[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-lab"
version = "0.1.0"
description = "NFL matchup projections, Monte Carlo sims, backtests and pick'em lineups (educational, not betting advice)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "scipy>=1.12", "requests>=2.31", "tzdata"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["nfl_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the downloaded nflverse cache (skipped when it is missing)",
    "leak: no-lookahead checks",
    "mutation: planted-leak checks that the leak checker must catch",
    "slow: takes more than a few seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]
