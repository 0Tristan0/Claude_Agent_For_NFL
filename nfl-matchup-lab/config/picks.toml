# How picks qualify and how lineups are sized.

margin = 0.03                 # model must beat break-even AND the devigged market by this much
# Without a sportsbook price, a PrizePicks line is the market: the model's lean is pulled toward 50% by this
# weight (chance used = 50% + weight x (model - 50%)). v0 has never been graded against real PrizePicks lines,
# so it gets partial trust until it is. 1.0 = trust the model fully.
model_only_weight = 0.5
devig_methods = ["multiplicative", "power", "shin"]   # qualify on the smallest edge across these
display_devig = "power"
breakeven_basis = "entry"     # a leg must clear the break-even of the entry size it goes into

# One-sided prices (only an Over or only a Yes is posted) carry hidden hold. These overrounds are
# assumed per stat and the leg is flagged "one-sided". Anytime TD yes-only markets carry far more hold.
[one_sided_overround]
default = 0.045
anytime_td = 0.20
pass_tds = 0.08

[line_mismatch]                # not implemented in v0: lines must match exactly
max_sd = 0.5                  # refuse to shift a book price to a PrizePicks line more than 0.5 SD away
refuse_integer_cross = true   # for count stats, refuse when the two lines straddle an integer

[info_gap]                     # v0 uses picks/lineups.py FAR_FROM_LINE (72%) instead
flag_sd = 1.5                 # model vs market gaps beyond this are flagged "check news", not "edge"

[lineups]
sizes = [2, 3, 4, 5, 6]            # PrizePicks: Power 2-6 picks, Flex 3-6 picks
max_exhaustive = 50000        # combinations; above this only the legs with the biggest edges are searched
min_ev_se = 2.0               # keep a lineup only if EV - 2 Monte Carlo SE > 1
shrink_to_reference = 0.25    # shrink leg probs 25% toward max(market, break-even) before ranking
negative_corr_block = -0.05   # never pair legs whose sim correlation is below this

[kelly]                        # not implemented in v0
enabled = false               # off until live CLV is positive with a CI that excludes 0
fraction = 0.25
cap = 0.02                    # max share of bankroll per entry
